name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zotra
          POSTGRES_PASSWORD: zotra
          POSTGRES_DB: zotra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zotra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZOTRA_TEST_DATABASE_URL: postgres://zotra:zotra@localhost:5432/zotra_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make check
