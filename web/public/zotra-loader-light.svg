<g mask="url(#zotra-loader-holes)">
<circle cx="80" cy="80" r="62" fill="none" stroke="#1a1523" stroke-width="16"/>
<g class="zotra-needle"><polygon fill="#d9cfe6" points="55.8,111.85 89.55,87.26 80,80 70.45,72.74"/><polygon fill="#820ad1" points="104.2,48.15 89.55,87.26 80,80 70.45,72.74"/></g>
