<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Loading">
<title>Loading</title>
<style>
.zotra-needle { animation: zotra-turn 1.1s linear infinite; transform-box: view-box; transform-origin: 80px 80px; }
